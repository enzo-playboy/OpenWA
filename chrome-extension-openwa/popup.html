<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>OpenWA Lead Hunter Settings</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #2563eb;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    body {
      width: 320px;
      margin: 0;
      padding: 1rem;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
      box-sizing: border-box;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.75rem;
      margin-bottom: 1rem;
    }

    .header h2 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .form-group {
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      padding: 0.5rem;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-color);
      font-size: 0.85rem;
      box-sizing: border-box;
    }

    input[type="range"] {
      width: 100%;
    }

    .value-badge {
      font-size: 0.85rem;
      font-weight: 700;
      color: #60a5fa;
    }

    .btn-save {
      width: 100%;
      padding: 0.625rem;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-save:hover {
      opacity: 0.9;
    }

    .status-msg {
      margin-top: 0.75rem;
      font-size: 0.8rem;
      text-align: center;
      color: #4ade80;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 1.4rem;">🎯</span>
    <h2>OpenWA Lead Hunter</h2>
  </div>

  <div class="form-group">
    <label>🌐 Filtro de Site no Google Maps:</label>
    <select id="filterWebsite">
      <option value="without">Apenas Empresas SEM Site / Link Cru</option>
      <option value="with">Apenas Empresas COM Site</option>
      <option value="all">Todas as Empresas</option>
    </select>
  </div>

  <div class="form-group">
    <div style="display: flex; justify-content: space-between;">
      <label>⭐ Nota Mínima no Google:</label>
      <span id="ratingVal" class="value-badge">4.5</span>
    </div>
    <input type="range" id="minRating" min="1.0" max="5.0" step="0.1" value="4.5">
  </div>

  <div class="form-group">
    <label>💬 Mínimo de Avaliações (Elimina Loja de Esquina):</label>
    <input type="number" id="minReviews" value="25" min="0" max="500">
  </div>

  <div class="form-group">
    <label>🔗 URL da API do OpenWA Backend:</label>
    <input type="text" id="apiUrl" value="http://localhost:2785">
  </div>

  <div class="form-group">
    <label>🔑 Chave API (X-API-Key):</label>
    <input type="text" id="apiKey" placeholder="Sua chave API do OpenWA">
  </div>

  <button id="btnSave" class="btn-save">Salvar Configurações</button>
  <div id="statusMsg" class="status-msg"></div>

  <script src="popup.js"></script>
</body>
</html>
